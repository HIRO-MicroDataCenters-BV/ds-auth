name: Integration tests

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ds-auth + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-pull registry images
        run: |
          docker pull openpolicyagent/opa:latest
          docker pull ghcr.io/hiro-microdatacenters-bv/ds-policy-engine:0.1.0-dev.35.develop.04feb982

      - name: Build local images + bring stack up
        working-directory: tests/integration
        run: docker compose up -d --build --quiet-pull

      - name: Wait for stack health
        working-directory: tests/integration
        run: |
          for i in {1..60}; do
            healthy=$(docker compose ps --format json | python -c "
          import sys, json
          try:
              lines = sys.stdin.read().strip().split('\n')
              statuses = []
              for ln in lines:
                  if not ln.strip(): continue
                  s = json.loads(ln)
                  statuses.append(s.get('Health') or s.get('Status',''))
              print(all('healthy' in str(s).lower() or 'up' in str(s).lower() for s in statuses))
          except Exception as e:
              print(f'err:{e}')
          ")
            if [ "$healthy" = "True" ]; then
              echo "all services healthy after ${i}s"
              break
            fi
            sleep 2
          done
          docker compose ps

      - name: Dump compose logs (pre-tests)
        if: always()
        working-directory: tests/integration
        run: docker compose logs --no-color --tail 50

      - name: Run integration tests
        env:
          DS_AUTH_IT_SKIP_COMPOSE: "1"   # already up — don't let the fixture restart it
        run: pytest tests/integration -v --maxfail=3

      - name: Dump compose logs (post-tests)
        if: always()
        working-directory: tests/integration
        run: docker compose logs --no-color --tail 150

      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose down -v
